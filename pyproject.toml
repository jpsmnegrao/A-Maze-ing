# Project packaging configuration
# Defines project metadata and build settings for creating the mazegen wheel package

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "A_Maze_ing"
version = "0.1.0"

[tool.setuptools]
py-modules = ["config", "a_maze_ing"]

[tool.setuptools.packages.find]
exclude = ["mlx_CLXV*", "matrix*", "tests*"]