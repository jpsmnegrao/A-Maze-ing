# Project packaging configuration
# Defines project metadata and build settings for creating the mazegen wheel package

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mazegen"
version = "1.0.0"
description = "Maze generator for 42 school A-Maze-ing project"
authors = [{name = "jpaim-so"}]
requires-python = ">=3.10"
dependencies = []

[tool.setuptools]
packages = ["mazegen"]